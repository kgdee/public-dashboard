<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="vendor/bootstrap-icons-1.13.2/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/utils.css" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="vendor/firebasejs-10.10.0/firebase-app-compat.js" defer></script>
    <script src="vendor/firebasejs-10.10.0/firebase-auth-compat.js" defer></script>
    <script src="vendor/firebasejs-10.10.0/firebase-firestore-compat.js" defer></script>
    <script src="vendor/supabase-js-2/supabase-js@2.js"></script>
    <script src="js/constants.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/db.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/toast.js" defer></script>
    <script src="js/confirm-modal.js" defer></script>
    <script src="js/avatar.js" defer></script>
    <script src="js/data-manager.js" defer></script>
    <script src="js/items-manager.js" defer></script>
    <script src="js/document-manager.js" defer></script>
    <script src="js/value-modal.js" defer></script>
    <script src="js/search-bar.js" defer></script>
  </head>
  <body>
    <div class="app container">
      <!-- Navbar -->
      <header class="navbar">
        <div class="logo">Dashboard</div>

        <div class="user-control"></div>
      </header>

      <main>
        <div class="global-stats"></div>

        <div class="breadcrumbs"></div>

        <div>
          <div class="data-manager">
            <div class="items-manager hidden">
              <div class="header">
                <div class="title"></div>
                <div class="actions">
                  <button class="button" onclick="ItemsManager.toggleMenuModal()"><i class="bi bi-three-dots"></i></button>
                </div>
              </div>
  
              <table class="data-table">
                <colgroup>
                  <col style="width: 70%" />
                  <col style="width: auto" />
                </colgroup>
                <thead>
                  <tr>
                    <th>Label</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
  
              <div class="modal menu-modal hidden" onclick="ItemsManager.toggleMenuModal()">
                <div class="modal-content" onclick="event.stopPropagation()">
                  <div class="modal-body item-list">
                    <div onclick="ItemsManager.addItem()"><i class="bi bi-plus-lg"></i> Add item</div>
                    <div onclick="loadData()"><i class="bi bi-arrow-clockwise"></i> Refresh</div>
                    <div onclick="SearchBar.toggle()"><i class="bi bi-search"></i> Search</div>
                    <label>
                      <i class="bi bi-box-arrow-in-down"></i> Import
                      <input type="file" accept=".json" hidden onchange="ItemsManager.importItems(this.files[0])" />
                    </label>
                    <div onclick="ItemsManager.exportItems()"><i class="bi bi-box-arrow-up"></i> Export</div>
                  </div>
                </div>
              </div>
            </div>
  
            <div class="document-manager hidden">
              <div class="header">
                <div class="title"></div>
                <div class="actions">
                  <button class="button" onclick="DocumentManager.toggleMenuModal()"><i class="bi bi-three-dots"></i></button>
                </div>
              </div>
              <table class="data-table">
                <colgroup>
                  <col style="width: 20%" />
                  <col style="width: 60%" />
                  <col style="width: auto" />
                </colgroup>
                <thead>
                  <tr>
                    <th>Property</th>
                    <th>Value</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
  
              <div class="modal menu-modal hidden" onclick="DocumentManager.toggleMenuModal()">
                <div class="modal-content" onclick="event.stopPropagation()">
                  <div class="modal-body item-list">
                    <div class="hidden" data-item-id="save" onclick="DocumentManager.save()"><i class="bi bi-check-lg"></i> Save changes</div>
                    <div onclick="DocumentManager.addProperty()"><i class="bi bi-plus-lg"></i> Add property</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="message">Loading...</div>
          </div>
        </div>
      </main>

      <!-- Menu modal -->
      <div class="menu-modal list-modal modal hidden" onclick="toggleMenuModal()">
        <div class="container">
          <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="toggleMenuModal()">
              <i class="bi bi-x-lg"></i>
            </button>
            <div class="title">Menu</div>

            <div class="modal-body">
              <div class="profile-display">
                <div class="avatar self-avatar"></div>
                <span class="self-username">User name</span>
              </div>

              <div class="item-list">
                <label class="item">
                  <i class="bi bi-gear"></i>
                  <div class="info">Settings & privacy</div>
                  <div class="arrow">›</div>
                </label>

                <label class="item" onclick="toggleCodeModal()">
                  <i class="bi bi-braces"></i>
                  <div class="info">Format code</div>
                  <div class="arrow">›</div>
                </label>

                <label class="item" data-setting-id="darkTheme">
                  <i class="bi bi-moon"></i>
                  <div class="info">
                    Dark theme
                    <span class="desc">Enabled</span>
                  </div>
                  <label class="toggle">
                    <input type="checkbox" onchange="toggleSetting('darkTheme')" />
                    <span class="slider"></span>
                  </label>
                </label>

                <label class="item" onclick="logout()">
                  <i class="bi bi-box-arrow-right"></i>
                  <div class="info">Log out</div>
                  <div class="arrow">›</div>
                </label>
              </div>
            </div>

            <div class="modal-footer">Privacy · Terms · Advertising · Ad choices ▷ · Cookies · More</div>
          </div>
        </div>
      </div>

      <!-- Value modal -->
      <div class="modal value-modal hidden" onclick="ValueModal.close()">
        <div class="modal-content" onclick="stopPropagation(event)">
          <button class="close-btn" onclick="ValueModal.close()">
            <i class="bi bi-x-lg"></i>
          </button>
          <div class="modal-title">Fill value</div>

          <div class="modal-body item-list">
            <label class="item">
              <i class="bi bi-file-earmark-plus"></i>Choose a file
              <input type="file" onchange="ValueModal.inputFile(this.files[0])" hidden />
            </label>
            <button class="item" onclick="ValueModal.inputId()"><i class="bi bi-card-text"></i>Generate ID</button>
            <button class="item" onclick="ValueModal.inputUsername()"><i class="bi bi-person-circle"></i>Random Username</button>
            <button class="item" onclick="ValueModal.inputObject()"><i class="bi bi-braces"></i>Template object</button>
          </div>

          <div class="modal-actions hidden">
            <button class="button">Create</button>
          </div>
        </div>
      </div>

      <!-- Code modal -->
      <div class="modal code-modal hidden" onclick="toggleCodeModal()">
        <div class="modal-content" onclick="stopPropagation(event)">
          <button class="close-btn" onclick="toggleCodeModal()">
            <i class="bi bi-x-lg"></i>
          </button>
          <div class="modal-title">Format code</div>

          <div class="modal-body">
            <textarea placeholder="Enter your code..."></textarea>
          </div>

          <div class="modal-actions">
            <button class="button" onclick="formatCode()">Format</button>
          </div>
        </div>
      </div>

      <!-- Search bar -->
      <div class="search-bar hidden">
        <input type="text" placeholder="Find..." oninput="SearchBar.search()" />
        <button class="close-btn" onclick="SearchBar.toggle(false)"><i class="bi bi-x-lg"></i></button>
      </div>

      <!-- Confirm modal -->
      <div class="confirm-modal modal hidden" onclick="ConfirmModal.cancel()">
        <div class="modal-content" onclick="stopPropagation(event)">
          <button class="close-btn" onclick="ConfirmModal.cancel()">
            <i class="bi bi-x-lg"></i>
          </button>
          <div class="modal-title">Delete item</div>
          <div class="msg">Are you sure you want to delete "item"</div>

          <div class="modal-actions">
            <button class="button" onclick="ConfirmModal.cancel()">Cancel</button>
            <button class="button btn-danger" onclick="ConfirmModal.confirm()">Confirm</button>
          </div>
        </div>
      </div>

      <div class="loading-overlay hidden">
        <div class="spinner"></div>
      </div>

      <div class="toast hidden"></div>
    </div>
  </body>
</html>
